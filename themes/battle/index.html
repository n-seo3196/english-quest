<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>English Quest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#3a7a28}
body{touch-action:none;font-family:'Segoe UI',sans-serif;user-select:none}
#c{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
#score-bar{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:5px;justify-content:space-between;align-items:flex-start}
.stat{background:rgba(40,30,10,0.8);color:#f0e6c0;padding:7px 16px;border-radius:6px;font-size:15px;font-weight:600;border:1px solid rgba(180,150,80,0.4)}
.stat span{color:#ffd700}
#quiz-box{position:fixed;top:50px;left:50%;transform:translateX(-50%);width:fit-content;max-width:92vw;
background:rgba(30,20,5,0.93);border:2px solid #8b6914;border-radius:12px;padding:14px 20px;
text-align:center;display:none;z-index:3;pointer-events:none}
#q-text{color:#f0e6c0;font-size:24px;line-height:1.6;margin-bottom:6px;font-weight:600;white-space:nowrap}
#hint-tip{color:rgba(240,225,170,0.75);font-size:20px;margin-top:6px;letter-spacing:0.02em}
#hint-box{margin-top:4px}
.hint-slot{display:inline-block;margin:2px;padding:3px 7px;border-radius:5px;font-size:10px;font-weight:600}
.hint-locked{background:rgba(255,255,255,0.06);color:#665530;border:1px dashed #554420}
.hint-open{background:rgba(255,215,0,0.12);color:#ffd700;border:1px solid rgba(255,215,0,0.4)}
#feedback{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:700;
color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.8);opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;
align-items:center;justify-content:center;pointer-events:auto;z-index:10}
#start-screen{background:rgba(20,40,10,0.95)}
#game-over{background:rgba(20,40,10,0.93);display:none}
.overlay h1,.overlay h2{color:#f0e6c0;font-size:24px;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.overlay p{color:#a0b088;font-size:13px;margin-bottom:18px;text-align:center;padding:0 20px;line-height:1.7}
.big-btn{padding:14px 40px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8b6914,#a07818);
border:2px solid #c4a030;border-radius:10px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
.final-score{color:#ffd700;font-size:42px;font-weight:700;margin-bottom:6px}
.final-detail{color:#a0b088;font-size:13px;margin-bottom:18px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.1}}
#collection-screen{background:rgba(20,40,10,0.97);overflow-y:auto}
#col-run-score{color:#ffd700;font-size:28px;font-weight:700;margin:4px 0 2px}
#col-bank{color:#a0b088;font-size:13px;margin-bottom:16px}
#col-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:360px;margin-bottom:4px}
.col-card{width:90px;border-radius:12px;padding:10px 6px 8px;text-align:center;font-size:11px;font-weight:700;border:2px solid;transition:all .2s}
.col-owned{border-color:#ffd700;background:rgba(255,215,0,0.13);color:#f0e6c0}
.col-locked{border-color:#554420;background:rgba(30,20,5,0.7);color:#665530}
.col-secret{border-color:#1a1a1a;background:rgba(8,8,8,0.9);color:#333}
.col-card .c-emoji{font-size:30px;display:block;margin-bottom:4px;line-height:1}
.col-card .c-secret-box{width:36px;height:36px;background:#111;border-radius:8px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#2a2a2a}
.col-card .c-name{font-size:11px;margin-bottom:4px;min-height:14px}
.col-card .c-badge{font-size:10px;color:#4caf50}
.col-buy{margin-top:5px;padding:3px 10px;font-size:10px;font-weight:700;background:rgba(180,150,80,0.2);border:1px solid #8b6914;border-radius:10px;color:#ffd700;cursor:pointer}
.col-buy:disabled{opacity:0.3;cursor:not-allowed}
#owned-display{background:rgba(40,30,10,0.8);padding:5px 10px;border-radius:6px;font-size:20px;border:1px solid rgba(180,150,80,0.4);letter-spacing:3px;pointer-events:none;line-height:1}
#village-dialog{position:fixed;bottom:28%;left:50%;transform:translateX(-50%);width:fit-content;max-width:88vw;
background:rgba(30,20,5,0.96);border:2px solid #8b6914;border-radius:14px;padding:16px 22px;
text-align:center;z-index:6;pointer-events:auto;display:none}
#village-dialog p{color:#f0e6c0;font-size:14px;line-height:1.8;margin-bottom:14px}
.vd-btn{padding:10px 22px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8b6914,#a07818);
border:2px solid #c4a030;border-radius:10px;cursor:pointer;margin:0 6px;text-shadow:0 1px 3px rgba(0,0,0,0.4)}
#left-col{display:flex;flex-direction:column;gap:5px;align-items:stretch}
#hint-noti{background:rgba(30,20,5,0.85);color:#ffd700;font-size:13px;font-weight:700;padding:7px 16px;border-radius:6px;border:1px solid rgba(255,215,0,0.5);text-align:center;line-height:1.8;animation:blink 1.4s ease-in-out infinite;pointer-events:none;z-index:3}
#inventory{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:none;gap:7px;z-index:3;pointer-events:none}
.inv-slot{width:22vw;max-width:165px;min-height:200px;background:rgba(255,252,235,0.12);border:2px dashed rgba(180,150,80,0.35);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:16px 10px;text-align:center;font-size:14px;color:rgba(180,150,80,0.4);transition:all .35s}
.inv-slot.filled{background:rgba(255,252,220,0.93);border:2px solid #c4a030;color:#3a2800;font-weight:700;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,0.35)}
.inv-slot .slot-lbl{font-size:10px;color:#a08040;font-weight:700;letter-spacing:.05em}
#dpad{position:fixed;bottom:20px;left:10px;pointer-events:auto;display:none;z-index:8}
#dpad-grid{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:3px}
.dpad-btn{width:50px;height:50px;background:rgba(30,20,5,0.7);border:2px solid rgba(180,150,80,0.5);
border-radius:12px;color:#f0e6c0;font-size:22px;display:flex;align-items:center;justify-content:center;
cursor:pointer;-webkit-tap-highlight-color:transparent}
.dpad-btn:active{background:rgba(180,150,80,0.35)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score-bar">
    <div id="left-col">
      <div class="stat">SCORE <span id="s-score">0</span></div>
      <div id="hint-noti" style="display:none">ヒントなし<br>=スコアUP▲</div>
      <div id="owned-display" style="display:none"></div>
    </div>
    <div class="stat">STAGE <span id="s-stage">1</span>/5</div>
    <div class="stat">COMBO <span id="s-combo">-</span></div>
  </div>
  <div id="feedback"></div>
  <div id="dpad">
    <div id="dpad-grid">
      <div></div><div class="dpad-btn" data-dir="up">&#x25B2;</div><div></div>
      <div class="dpad-btn" data-dir="left">&#x25C0;</div><div></div><div class="dpad-btn" data-dir="right">&#x25B6;</div>
      <div></div><div class="dpad-btn" data-dir="down">&#x25BC;</div><div></div>
    </div>
  </div>
</div>
<div id="inventory">
  <div class="inv-slot" id="inv-slot-0"></div>
  <div class="inv-slot" id="inv-slot-1"></div>
  <div class="inv-slot" id="inv-slot-2"></div>
</div>
<div id="village-dialog">
  <p>&#x1F9D9; 村人：おかえり、勇者よ！<br>スコアを使ってアイテムと交換できるぞ。</p>
  <button class="vd-btn" id="vd-shop">アイテムと交換</button>
  <button class="vd-btn" id="vd-retry" style="background:linear-gradient(135deg,#2a5a1a,#3a7a28);border-color:#4a8a38">もう一度プレイ</button>
</div>
<div id="quiz-box">
  <div id="q-text"></div>
  <div id="hint-tip"></div>
  <div id="hint-box"></div>
</div>
<div class="overlay" id="start-screen">
  <h1>&#x2694;&#xFE0F; English Quest</h1>
  <p>冒険の道を進んで<br>正しい答えのゲートをくぐろう！<br><br>&#x1F4A1; 道のアイテムを取るとヒントが開くよ<br><br>&#x2328;&#xFE0F; 矢印キー / WASD で移動<br>&#x1F4F1; スマホは十字キーで移動</p>
  <button class="big-btn" id="start-btn">冒険に出発！</button>
</div>
<div class="overlay" id="game-over">
  <h2 id="go-title">&#x1F3C6; QUEST COMPLETE</h2>
  <div class="final-score" id="final-score">0</div>
  <div class="final-detail" id="final-detail"></div>
  <button class="big-btn" id="retry-btn">もう一度プレイ</button>
</div>
<div class="overlay" id="collection-screen" style="display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px">
  <h2 style="color:#f0e6c0;font-size:22px;margin-bottom:2px">&#x2694;&#xFE0F; QUEST COMPLETE</h2>
  <div id="col-run-score">0</div>
  <div id="col-bank"></div>
  <div id="col-grid"></div>
  <div style="display:flex;gap:12px;margin-top:16px">
    <button class="big-btn" id="col-retry">もう一度プレイ</button>
    <button class="big-btn" id="col-top" style="background:linear-gradient(135deg,#2a5a1a,#3a7a28);border-color:#4a8a38">トップへ</button>
  </div>
</div>

<script>
var cv = document.getElementById('c');
var cx = cv.getContext('2d');
var W = 0, H = 0;
var TILE = 40;
var ROAD_LEFT = 4;
var ROAD_RIGHT = 16;
var MAP_W = 21;

function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

var questions = [
  // ── 現在形（I/you/we/they） ──
  {emoji:"⚔️", sentence:"I ______ every day to become stronger.", answer:"train",
   japanese:"私は強くなるために毎日______。", j_answer:"鍛える",
   choices:["train","trains","trained"],
   hints:["主語 = I → 動詞はそのまま","I のときは s はつかない","train → そのまま使う"]},
  {emoji:"🏰", sentence:"We ______ the enemy every night.", answer:"watch",
   japanese:"私たちは毎晩、敵を______。", j_answer:"見張る",
   choices:["watch","watches","watched"],
   hints:["主語 = We → 動詞はそのまま","We のときは s はつかない","watch → そのまま使う"]},
  {emoji:"🗡️", sentence:"You ______ magic at the academy.", answer:"learn",
   japanese:"あなたは学院で魔法を______。", j_answer:"学ぶ",
   choices:["learn","learns","learned"],
   hints:["主語 = You → 動詞はそのまま","You のときは s はつかない","learn → そのまま使う"]},
  {emoji:"👾", sentence:"They ______ the village every day.", answer:"save",
   japanese:"彼らは毎日、村を______。", j_answer:"救う",
   choices:["save","saves","saved"],
   hints:["主語 = They → 動詞はそのまま","They のときは s はつかない","save → そのまま使う"]},
  {emoji:"🔥", sentence:"We ______ the dungeon every weekend.", answer:"clear",
   japanese:"私たちは毎週末、ダンジョンを______。", j_answer:"クリアする",
   choices:["clear","clears","cleared"],
   hints:["主語 = We → 動詞はそのまま","We のときは s はつかない","clear → そのまま使う"]},
  {emoji:"🛡️", sentence:"I ______ my sword after every battle.", answer:"clean",
   japanese:"私は戦いのたびに剣を______。", j_answer:"磨く",
   choices:["clean","cleans","cleaned"],
   hints:["主語 = I → 動詞はそのまま","I のときは s はつかない","clean → そのまま使う"]},
  {emoji:"💫", sentence:"You ______ your friends in every battle.", answer:"help",
   japanese:"あなたは毎回の戦いで仲間を______。", j_answer:"助ける",
   choices:["help","helps","helped"],
   hints:["主語 = You → 動詞はそのまま","You のときは s はつかない","help → そのまま使う"]},
  // ── 三単現（he/she/it/固有名詞） ──
  {emoji:"🐉", sentence:"The hero ______ the dragon.", answer:"attacks",
   japanese:"勇者はドラゴンを______。", j_answer:"攻撃する",
   choices:["attack","attacks","attacked"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","The hero = 三人称単数","現在の文 → 現在形"]},
  {emoji:"🧙", sentence:"She ______ magic every day.", answer:"uses",
   japanese:"彼女は毎日、魔法を______。", j_answer:"使う",
   choices:["use","uses","used"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","She = 三人称単数 → s","use の三単現は uses"]},
  {emoji:"🔥", sentence:"The dragon ______ in the sky every night.", answer:"flies",
   japanese:"ドラゴンは毎晩、空を______。", j_answer:"飛ぶ",
   choices:["fly","flies","flew"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","The dragon = 三人称単数","fly の三単現は flies"]},
  {emoji:"🧝", sentence:"The elf ______ through the forest every day.", answer:"runs",
   japanese:"エルフは毎日、森の中を______。", j_answer:"走る",
   choices:["run","runs","ran"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","The elf = 三人称単数","run の三単現は runs"]},
  {emoji:"👸", sentence:"The princess ______ her friends every battle.", answer:"helps",
   japanese:"王女は毎回の戦いで、仲間を______。", j_answer:"助ける",
   choices:["help","helps","helped"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","The princess = 三人称単数","help の三単現は helps"]},
  {emoji:"🧙‍♂️", sentence:"The wizard ______ a new spell every day.", answer:"learns",
   japanese:"魔法使いは毎日、新しい呪文を______。", j_answer:"覚える",
   choices:["learn","learns","learned"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","The wizard = 三人称単数","learn の三単現は learns"]},
  {emoji:"⚔️", sentence:"He ______ his sword every morning.", answer:"cleans",
   japanese:"彼は毎朝、剣を______。", j_answer:"磨く",
   choices:["clean","cleans","cleaned"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","He = 三人称単数","clean の三単現は cleans"]},
  {emoji:"🛡️", sentence:"The knight ______ the weak every day.", answer:"saves",
   japanese:"騎士は毎日、弱い者を______。", j_answer:"救う",
   choices:["save","saves","saved"],
   hints:["主語 = 自分と相手以外の<br>1人か1つ","The knight = 三人称単数","save の三単現は saves"]},
  // ── 現在進行形 ──
  {emoji:"👾", sentence:"The monsters ______ the town now.", answer:"are attacking",
   japanese:"モンスターたちは今、街を______。", j_answer:"攻撃している",
   choices:["attack","attacks","are attacking"],
   hints:["now = 今 → 現在進行形","monsters = 複数 → are","進行形 = are + 動詞ing"]},
  {emoji:"🐉", sentence:"The dragon ______ over the castle right now.", answer:"is flying",
   japanese:"ドラゴンは今、城の上を______。", j_answer:"飛んでいる",
   choices:["fly","flies","is flying"],
   hints:["right now = 今 → 現在進行形","The dragon = 単数 → is","進行形 = is + 動詞ing"]},
  {emoji:"🔮", sentence:"I ______ a new magic spell now.", answer:"am learning",
   japanese:"私は今、新しい呪文を______。", j_answer:"覚えている",
   choices:["learn","learns","am learning"],
   hints:["now = 今 → 現在進行形","I のときは am を使う","進行形 = am + 動詞ing"]},
  {emoji:"🌲", sentence:"The heroes ______ the dark forest now.", answer:"are crossing",
   japanese:"勇者たちは今、暗い森を______。", j_answer:"渡っている",
   choices:["cross","crosses","are crossing"],
   hints:["now = 今 → 現在進行形","heroes = 複数 → are","進行形 = are + 動詞ing"]},
  {emoji:"🧪", sentence:"The witch ______ a potion right now.", answer:"is making",
   japanese:"魔女は今、薬を______。", j_answer:"作っている",
   choices:["make","makes","is making"],
   hints:["right now = 今 → 現在進行形","The witch = 単数 → is","進行形 = is + 動詞ing"]},
  {emoji:"⚔️", sentence:"He ______ with the dark knight right now.", answer:"is fighting",
   japanese:"彼は今、ダークナイトと______。", j_answer:"戦っている",
   choices:["fight","fights","is fighting"],
   hints:["right now = 今 → 現在進行形","He = 単数 → is","進行形 = is + 動詞ing"]},
  {emoji:"🏃", sentence:"We ______ to the castle now.", answer:"are running",
   japanese:"私たちは今、城へ______。", j_answer:"走っている",
   choices:["run","runs","are running"],
   hints:["now = 今 → 現在進行形","We = 複数 → are","進行形 = are + 動詞ing"]},
  {emoji:"🏰", sentence:"The enemy ______ our castle right now.", answer:"is attacking",
   japanese:"敵は今、私たちの城を______。", j_answer:"攻撃している",
   choices:["attack","attacks","is attacking"],
   hints:["right now = 今 → 現在進行形","The enemy = 単数 → is","進行形 = is + 動詞ing"]},
  // ── 過去形 ──
  {emoji:"🛡️", sentence:"I ______ my shield yesterday.", answer:"used",
   japanese:"私は昨日、盾を______。", j_answer:"使った",
   choices:["use","uses","used"],
   hints:["yesterday → 過去形","use の過去形は used","過去形は主語で変わらない"]},
  {emoji:"⚔️", sentence:"We ______ the final stage last night.", answer:"cleared",
   japanese:"私たちは昨夜、最終ステージを______。", j_answer:"クリアした",
   choices:["clear","clears","cleared"],
   hints:["last night → 過去形","clear の過去形 = cleared","We でも過去形は同じ"]},
  {emoji:"🏛️", sentence:"They ______ the ancient ruins last month.", answer:"visited",
   japanese:"彼らは先月、古代遺跡を______。", j_answer:"訪れた",
   choices:["visit","visits","visited"],
   hints:["last month → 過去形","visit の過去形は visited","過去形は主語で変わらない"]},
  {emoji:"👸", sentence:"The knight ______ the princess last week.", answer:"helped",
   japanese:"騎士は先週、王女を______。", j_answer:"助けた",
   choices:["help","helps","helped"],
   hints:["last week → 過去形","help の過去形は helped","過去形は主語で変わらない"]},
  {emoji:"👾", sentence:"The monsters ______ the village last night.", answer:"attacked",
   japanese:"モンスターたちは昨夜、村を______。", j_answer:"攻撃した",
   choices:["attack","attacks","attacked"],
   hints:["last night → 過去形","attack の過去形は attacked","過去形は主語で変わらない"]},
  {emoji:"🔮", sentence:"We ______ the dragon yesterday.", answer:"fought",
   japanese:"私たちは昨日、ドラゴンと______。", j_answer:"戦った",
   choices:["fight","fights","fought"],
   hints:["yesterday → 過去形","fight の過去形は fought（不規則）","We でも過去形は同じ"]},
  {emoji:"💚", sentence:"She ______ the wounded knight yesterday.", answer:"healed",
   japanese:"彼女は昨日、傷ついた騎士を______。", j_answer:"回復させた",
   choices:["heal","heals","healed"],
   hints:["yesterday → 過去形","heal の過去形は healed","過去形は主語で変わらない"]}
];

var shopItems = [
  {id:'sword',     emoji:'⚔️', name:'短剣',         type:'武器', price:150, secret:false},
  {id:'wand',      emoji:'🪄', name:'魔法の杖',      type:'魔法', price:250, secret:false},
  {id:'bow',       emoji:'🏹', name:'弓',             type:'武器', price:350, secret:false},
  {id:'crystal',   emoji:'🔮', name:'水晶玉',         type:'魔法', price:500, secret:false},
  {id:'holysword', emoji:'🗡️', name:'聖剣',           type:'武器', price:700, secret:true},
  {id:'spellbook', emoji:'📖', name:'封印の魔法書',   type:'魔法', price:900, secret:true}
];
var bank = parseInt(localStorage.getItem('eq_bank') || '0');
var owned = JSON.parse(localStorage.getItem('eq_owned') || '[]');
var shuffledQuestions = [];
var player = { col: 10, worldY: 0, px: 0, py: 0, dir: 'up', frame: 0 };
var camY = 0;
var score = 0, combo = 0, stage = 0;
var villageWorldY = 0;
var currentQ = null, hintsOpened = 0, answered = false;
var gameState = 'title';
var lastMoveTime = 0;
var keysDown = {};
var particles = [];
var hintItems = [];
var gateObj = null;

function seededRand(x, y) {
  var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5;
  return n - Math.floor(n);
}

function getTile(col, row) {
  if (col < ROAD_LEFT || col > ROAD_RIGHT) return 0;
  if (col === ROAD_LEFT || col === ROAD_RIGHT) return 2;
  return 1;
}

function shuffleArray(arr) {
  var sh = arr.slice();
  for (var j = sh.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var tmp = sh[j]; sh[j] = sh[k]; sh[k] = tmp;
  }
  return sh;
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  if ('ontouchstart' in window) document.getElementById('dpad').style.display = 'block';
  document.getElementById('hint-noti').style.display = 'block';
  document.getElementById('inventory').style.display = 'flex';
  stage = 0; score = 0; combo = 0;
  shuffledQuestions = shuffleArray(questions).slice(0, 5);
  updateOwnedDisplay();
  startStage();
}

function startStage() {
  currentQ = shuffledQuestions[stage];
  hintsOpened = 0; answered = false; particles = [];
  player.col = 10; player.worldY = 0; player.dir = 'up'; player.frame = 0;
  player.px = player.col * TILE + TILE / 2;
  player.py = player.worldY * TILE + TILE / 2;
  camY = player.py;
  hintItems = [];
  var hDist = [-9, -10, -11];
  for (var i = 0; i < Math.min(hDist.length, currentQ.hints.length); i++) {
    hintItems.push({ worldY: hDist[i], col: 7 + Math.floor(Math.random() * 7), collected: false });
  }
  var sh = shuffleArray(currentQ.choices);
  gateObj = { worldY: -15, choices: sh, hit: false, zones: [[5,8],[9,12],[13,16]] };
  document.getElementById('s-stage').textContent = (stage + 1);
  updateUI(); showQuiz(); updateInventory();
  gameState = 'playing';
}

function showQuiz() {
  var q = currentQ;
  var sentence = q.sentence.replace('______', '<b style="color:#ffd700;border-bottom:2px dashed #ffd700;padding:0 6px">______</b>');
  document.getElementById('q-text').innerHTML = '<span style="font-size:24px">' + q.emoji + '</span> ' + sentence;
  document.getElementById('hint-tip').textContent = q.japanese;
  document.getElementById('hint-box').innerHTML = '';
  document.getElementById('quiz-box').style.display = 'block';
}

function updateUI() {
  document.getElementById('s-score').textContent = bank + score;
  document.getElementById('s-combo').textContent = combo > 0 ? 'x' + combo : '-';
}

function showFB(txt, col) {
  var fb = document.getElementById('feedback');
  fb.textContent = txt; fb.style.color = col; fb.style.opacity = '1';
  setTimeout(function() { fb.style.opacity = '0'; }, 1400);
}

function addP(wx, wy, col, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = Math.random() * 2.5 + 0.8;
    particles.push({ wx: wx, wy: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30, col: col, sz: Math.random() * 3 + 1 });
  }
}

function tryMove(dir) {
  if ((gameState !== 'playing' && gameState !== 'victory') || answered) return;
  if (gameState === 'victory' && dir !== 'up') return;
  var nc = player.col, nwy = player.worldY;
  player.dir = dir;
  if (dir === 'up') nwy--;
  else if (dir === 'down') nwy++;
  else if (dir === 'left') nc--;
  else if (dir === 'right') nc++;
  if (nc < 0 || nc >= MAP_W) return;
  if (getTile(nc, nwy) === 0) return;
  player.col = nc; player.worldY = nwy;
  player.frame = (player.frame + 1) % 4;
  checkTile();
}

function checkTile() {
  var wy = player.worldY, c = player.col;
  for (var i = 0; i < hintItems.length; i++) {
    var h = hintItems[i];
    if (!h.collected && h.worldY === wy && h.col === c) {
      h.collected = true;
      if (hintsOpened < currentQ.hints.length) {
        hintsOpened++;
        addP(c * TILE + TILE / 2, wy * TILE + TILE / 2, '#ffd700', 12);
        showQuiz(); updateInventory();
      }
    }
  }
  if (gameState === 'victory' && player.worldY <= villageWorldY) {
    gameState = 'dialog';
    document.getElementById('village-dialog').style.display = 'block';
    return;
  }
  var g = gateObj;
  if (g && !g.hit && wy === g.worldY) {
    var zi = c <= 8 ? 0 : c <= 12 ? 1 : 2;
    {
        g.hit = true;
        g.chosenIdx = zi;
        var chosen = g.choices[zi];
        if (chosen === currentQ.answer) {
          g.correct = true;
          answered = true; combo++;
          var bonus = Math.max(0, 3 - hintsOpened) * 50;
          var comboBonus = combo > 1 ? (combo - 1) * 30 : 0;
          var pts = 100 + bonus + comboBonus;
          score += pts;
          addP(c * TILE + TILE / 2, wy * TILE + TILE / 2, '#4caf50', 18);
          showFB('✨ 正解！ +' + pts + 'pt', '#4caf50');
          var s2 = currentQ.sentence.replace('______', '<b style="color:#6f2">' + currentQ.answer + '</b>');
          document.getElementById('q-text').innerHTML = '<span style="font-size:24px">' + currentQ.emoji + '</span> ' + s2;
          document.getElementById('hint-tip').innerHTML = currentQ.japanese.replace('______', '<span style="color:#6f2">' + currentQ.j_answer + '</span>');
          updateUI();
          setTimeout(function() { nextStageOrEnd(); }, 1600);
        } else {
          g.correct = false;
          combo = 0; score = Math.max(0, score - 20);
          addP(c * TILE + TILE / 2, wy * TILE + TILE / 2, '#ff4444', 10);
          showFB('✗ ' + chosen + ' ではない…', '#ff6666');
          updateUI();
          var savedWY = wy;
          setTimeout(function() { player.worldY = savedWY + 4; g.hit = false; }, 600);
        }
    }
  }
}

function updateInventory() {
  for (var i = 0; i < 3; i++) {
    var sl = document.getElementById('inv-slot-' + i);
    if (!sl) continue;
    if (currentQ && i < hintsOpened) {
      sl.className = 'inv-slot filled';
      sl.innerHTML = '<div class="slot-lbl">ヒント' + (i + 1) + '</div>' + currentQ.hints[i].replace(/ = /g, '<br>= ').replace(/ → /g, '<br>→');
    } else {
      sl.className = 'inv-slot';
      sl.innerHTML = '<span style="font-size:20px;opacity:.3">🔒</span>';
    }
  }
}

function saveStorage() {
  localStorage.setItem('eq_bank', bank);
  localStorage.setItem('eq_owned', JSON.stringify(owned));
}

function updateOwnedDisplay() {
  var el = document.getElementById('owned-display');
  if (!owned.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = owned.map(function(id) {
    for (var i = 0; i < shopItems.length; i++) { if (shopItems[i].id === id) return shopItems[i].emoji; }
    return '';
  }).join(' ');
}

function renderCollection() {
  document.getElementById('col-run-score').textContent = score + ' pt';
  document.getElementById('col-bank').textContent = '累計残高: ' + bank + ' pt';
  var grid = document.getElementById('col-grid');
  grid.innerHTML = '';
  for (var i = 0; i < shopItems.length; i++) {
    var item = shopItems[i];
    var isOwned = owned.indexOf(item.id) >= 0;
    var canBuy = !isOwned && bank >= item.price && !item.secret;
    var card = document.createElement('div');
    if (isOwned) {
      card.className = 'col-card col-owned';
      card.innerHTML = '<span class="c-emoji">' + item.emoji + '</span>'
        + '<div class="c-name">' + item.name + '</div>'
        + '<div class="c-badge">✓ 所持</div>';
    } else if (item.secret) {
      card.className = 'col-card col-secret';
      card.innerHTML = '<div class="c-secret-box">?</div>'
        + '<div class="c-name">???</div>';
    } else {
      card.className = 'col-card col-locked';
      card.innerHTML = '<span class="c-emoji" style="opacity:0.45">' + item.emoji + '</span>'
        + '<div class="c-name">' + item.name + '</div>';
      var btn = document.createElement('button');
      btn.className = 'col-buy';
      btn.textContent = item.price + 'pt 購入';
      btn.disabled = !canBuy;
      (function(id) {
        btn.addEventListener('click', function() { buyItem(id); });
      })(item.id);
      card.appendChild(btn);
    }
    grid.appendChild(card);
  }
}

function buyItem(id) {
  var item = null;
  for (var i = 0; i < shopItems.length; i++) { if (shopItems[i].id === id) { item = shopItems[i]; break; } }
  if (!item || bank < item.price || owned.indexOf(id) >= 0) return;
  bank -= item.price;
  owned.push(id);
  saveStorage();
  updateOwnedDisplay();
  renderCollection();
}

function showCollection() {
  bank += score;
  saveStorage();
  renderCollection();
  document.getElementById('collection-screen').style.display = 'flex';
}

function nextStageOrEnd() {
  stage++;
  if (stage >= shuffledQuestions.length) {
    gameState = 'victory';
    answered = false;
    villageWorldY = player.worldY - 18;
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('hint-noti').style.display = 'none';
    document.getElementById('inventory').style.display = 'none';
    showFB('🏰 館へ向かおう！', '#ffd700');
  } else { startStage(); }
}

window.addEventListener('keydown', function(e) {
  keysDown[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e) { keysDown[e.key] = false; });

var dpadBtns = document.querySelectorAll('.dpad-btn');
for (var di = 0; di < dpadBtns.length; di++) {
  (function(btn) {
    var dir = btn.getAttribute('data-dir');
    var iv = null;
    btn.addEventListener('touchstart', function(e) {
      e.preventDefault(); tryMove(dir);
      iv = setInterval(function() { tryMove(dir); }, 120);
    });
    btn.addEventListener('touchend', function() { clearInterval(iv); });
    btn.addEventListener('touchcancel', function() { clearInterval(iv); });
  })(dpadBtns[di]);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', function() {
  document.getElementById('game-over').style.display = 'none';
  startGame();
});
document.getElementById('col-retry').addEventListener('click', function() {
  document.getElementById('collection-screen').style.display = 'none';
  startGame();
});
document.getElementById('col-top').addEventListener('click', function() {
  location.href = '../../index.html';
});
document.getElementById('vd-shop').addEventListener('click', function() {
  document.getElementById('village-dialog').style.display = 'none';
  showCollection();
});
document.getElementById('vd-retry').addEventListener('click', function() {
  document.getElementById('village-dialog').style.display = 'none';
  startGame();
});

function handleKeys() {
  if (gameState !== 'playing' && gameState !== 'victory') return;
  var now = Date.now();
  if (now - lastMoveTime < 100) return;
  if (keysDown['ArrowUp'] || keysDown['w']) { tryMove('up'); lastMoveTime = now; }
  else if (keysDown['ArrowDown'] || keysDown['s']) { tryMove('down'); lastMoveTime = now; }
  else if (keysDown['ArrowLeft'] || keysDown['a']) { tryMove('left'); lastMoveTime = now; }
  else if (keysDown['ArrowRight'] || keysDown['d']) { tryMove('right'); lastMoveTime = now; }
}

function update() {
  handleKeys();
  var tx = player.col * TILE + TILE / 2;
  var ty = player.worldY * TILE + TILE / 2;
  player.px += (tx - player.px) * 0.3;
  player.py += (ty - player.py) * 0.3;
  camY += (player.py - camY) * 0.12;
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.wx += p.vx; p.wy += p.vy; p.life--; p.vy += 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawRoundRect(x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.lineTo(x + w - r, y);
  cx.quadraticCurveTo(x + w, y, x + w, y + r);
  cx.lineTo(x + w, y + h - r);
  cx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  cx.lineTo(x + r, y + h);
  cx.quadraticCurveTo(x, y + h, x, y + h - r);
  cx.lineTo(x, y + r);
  cx.quadraticCurveTo(x, y, x + r, y);
  cx.closePath();
}

function draw() {
  cx.fillStyle = '#3a7a28';
  cx.fillRect(0, 0, W, H);
  var offY = H * 0.55;
  var camOX = 10 * TILE + TILE / 2 - W / 2;
  var camOY = camY - offY;
  var startR = Math.floor(camOY / TILE) - 1;
  var endR = Math.ceil((camOY + H) / TILE) + 1;
  for (var r = startR; r <= endR; r++) {
    for (var c = 0; c < MAP_W; c++) {
      var sx = c * TILE - camOX;
      var sy = r * TILE - camOY;
      if (sx < -TILE || sx > W + TILE) continue;
      var t = getTile(c, r);
      if (t === 0) {
        cx.fillStyle = '#3a7a28';
        cx.fillRect(sx, sy, TILE, TILE);
        var rnd = seededRand(c, r);
        if (rnd > 0.35) {
          cx.fillStyle = '#4a8a35';
          cx.fillRect(sx + rnd * 18, sy + rnd * 22, 2, 5);
          cx.fillRect(sx + rnd * 18 + 5, sy + rnd * 22 - 2, 2, 6);
        }
        if (rnd > 0.78) {
          cx.fillStyle = rnd > 0.9 ? '#e55' : '#fc3';
          cx.beginPath(); cx.arc(sx + rnd * 28, sy + 14, 2.5, 0, Math.PI * 2); cx.fill();
        }
        if (rnd > 0.91 && (c < 3 || c > 17)) {
          cx.fillStyle = '#5a3a1a'; cx.fillRect(sx + 18, sy + 18, 5, 12);
          cx.fillStyle = '#2e6e1c';
          cx.beginPath(); cx.arc(sx + 20, sy + 10, 14, 0, Math.PI * 2); cx.fill();
          cx.fillStyle = '#2d5a1e';
          cx.beginPath(); cx.arc(sx + 20, sy + 6, 12, 0, Math.PI * 2); cx.fill();
        }
      } else if (t === 1) {
        cx.fillStyle = '#c4a86a';
        cx.fillRect(sx, sy, TILE, TILE);
        var rnd2 = seededRand(c + 99, r + 99);
        if (rnd2 > 0.65) {
          cx.fillStyle = 'rgba(160,130,80,0.35)';
          cx.fillRect(sx + rnd2 * 20, sy + rnd2 * 18, 5, 3);
        }
      } else {
        cx.fillStyle = '#8a7a50'; cx.fillRect(sx, sy, TILE, TILE);
        cx.fillStyle = '#9a8a5a'; cx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
      }
    }
  }
  for (var hi = 0; hi < hintItems.length; hi++) {
    var it = hintItems[hi];
    if (it.collected) continue;
    var ix = it.col * TILE + TILE / 2 - camOX;
    var iy = it.worldY * TILE + TILE / 2 - camOY;
    if (iy < -40 || iy > H + 40) continue;
    var bob2 = Math.sin(Date.now() * 0.004 + hi * 1.5) * 2.5;
    cx.save();
    cx.translate(ix, iy + bob2);
    cx.rotate(0.18);
    // 影
    cx.fillStyle = 'rgba(0,0,0,0.2)';
    cx.fillRect(-12, -15, 27, 34);
    // 紙本体
    cx.fillStyle = '#fffde8';
    cx.fillRect(-14, -17, 26, 33);
    // 折れ角
    cx.fillStyle = '#e8d870';
    cx.beginPath();
    cx.moveTo(6, -17); cx.lineTo(12, -10); cx.lineTo(12, -17);
    cx.closePath(); cx.fill();
    cx.fillStyle = '#c4ae40';
    cx.beginPath();
    cx.moveTo(6, -17); cx.lineTo(12, -10); cx.lineTo(6, -10);
    cx.closePath(); cx.fill();
    // 罫線
    cx.fillStyle = '#c0b890';
    cx.fillRect(-8, -6, 14, 2);
    cx.fillRect(-8, 0, 14, 2);
    cx.fillRect(-8, 6, 9, 2);
    // ヒントマーク
    cx.fillStyle = '#b8941e';
    cx.font = 'bold 12px sans-serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('?', -1, 13);
    cx.restore();
  }
  if (gateObj) {
    var g = gateObj;
    var gateScreenY = g.worldY * TILE - camOY;
    if (gateScreenY > -80 && gateScreenY < H + 80) {
      var signH = 56;
      var signY = gateScreenY - 10;
      for (var gi = 0; gi < 3; gi++) {
        var signW = 4 * TILE;
        var roadCenterX = 10 * TILE + TILE / 2 - camOX;
        var centerX = roadCenterX + (gi - 1) * signW;
        var gx = centerX - signW / 2;
        var gw = signW;
        var isCorrect = g.choices[gi] === currentQ.answer;
        var bgCol, borderCol, textCol;
        if (g.hit && g.correct) {
          if (isCorrect) { bgCol = 'rgba(40,120,40,0.92)'; borderCol = '#4caf50'; textCol = '#b9f6b9'; }
          else { bgCol = 'rgba(140,30,30,0.85)'; borderCol = '#c62828'; textCol = '#ffaaaa'; }
        } else if (g.hit && !g.correct && gi === g.chosenIdx) {
          bgCol = 'rgba(140,30,30,0.85)'; borderCol = '#c62828'; textCol = '#ffaaaa';
        } else { bgCol = 'rgba(50,35,15,0.92)'; borderCol = '#b8941e'; textCol = '#fff'; }
        cx.fillStyle = '#6a4e2a';
        cx.fillRect(gx + 4, signY - 8, 8, signH + 24);
        cx.fillStyle = '#7d5c34';
        cx.fillRect(gx + 6, signY - 8, 4, signH + 24);
        cx.fillStyle = '#6a4e2a';
        cx.fillRect(gx + gw - 12, signY - 8, 8, signH + 24);
        cx.fillStyle = '#7d5c34';
        cx.fillRect(gx + gw - 10, signY - 8, 4, signH + 24);
        drawRoundRect(gx + 6, signY, gw - 12, signH, 8);
        cx.fillStyle = bgCol; cx.fill();
        cx.strokeStyle = borderCol; cx.lineWidth = 2.5; cx.stroke();
        drawRoundRect(gx + 10, signY + 3, gw - 20, signH - 6, 5);
        cx.fillStyle = 'rgba(255,255,255,0.06)'; cx.fill();
        var badge = ['A', 'B', 'C'][gi];
        cx.fillStyle = borderCol;
        cx.beginPath(); cx.arc(gx + 22, signY + 16, 10, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = g.hit ? (isCorrect ? '#1b5e20' : '#4a0000') : '#3a2800';
        cx.font = 'bold 12px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.fillText(badge, gx + 22, signY + 16);
        cx.fillStyle = textCol;
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        var label = g.choices[gi];
        var maxW = gw - 20;
        cx.font = 'bold 18px sans-serif';
        var parts = label.split(' ');
        if (parts.length > 1 && cx.measureText(label).width > maxW) {
          cx.font = 'bold 15px sans-serif';
          var mid = Math.ceil(parts.length / 2);
          cx.fillText(parts.slice(0, mid).join(' '), centerX, signY + signH / 2 - 6);
          cx.fillText(parts.slice(mid).join(' '), centerX, signY + signH / 2 + 11);
        } else {
          var fs = 18;
          while (cx.measureText(label).width > maxW && fs > 11) { fs--; cx.font = 'bold ' + fs + 'px sans-serif'; }
          cx.fillText(label, centerX, signY + signH / 2 + 4);
        }
      }
      if (!g.hit) {
        var labelCX = 10 * TILE + TILE / 2 - camOX;
        var labelCY = signY - 18;
        cx.fillStyle = 'rgba(30,20,5,0.85)';
        drawRoundRect(labelCX - 64, labelCY - 12, 128, 24, 6);
        cx.fill();
        cx.strokeStyle = '#b8941e'; cx.lineWidth = 1.5; cx.stroke();
        cx.fillStyle = '#ffd700'; cx.font = 'bold 13px sans-serif';
        cx.fillText('⚔ どれが正解？', labelCX, labelCY);
      }
    }
  }
  var ppx = player.px - camOX;
  var ppy = player.py - camOY;
  cx.save(); cx.translate(ppx, ppy);
  var bob = Math.sin(Date.now() * 0.008) * 1.5;
  var isMoving = keysDown['ArrowUp'] || keysDown['ArrowDown'] || keysDown['ArrowLeft'] || keysDown['ArrowRight'] || keysDown['w'] || keysDown['a'] || keysDown['s'] || keysDown['d'];
  var legF = isMoving ? Math.sin(Date.now() * 0.015) * 5 : 0;
  var armF = isMoving ? Math.sin(Date.now() * 0.015) * 3 : 0;
  cx.fillStyle = 'rgba(0,0,0,0.18)';
  cx.beginPath(); cx.ellipse(0, 20, 14, 6, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = 'rgba(170,35,35,0.75)';
  cx.beginPath(); cx.moveTo(-7, -2 + bob); cx.lineTo(7, -2 + bob);
  cx.lineTo(9, 14 + bob); cx.lineTo(-9, 14 + bob); cx.closePath(); cx.fill();
  cx.fillStyle = '#5a4a2a';
  cx.fillRect(-8, 8 + bob + legF, 6, 9);
  cx.fillRect(2, 8 + bob - legF, 6, 9);
  cx.fillStyle = '#3a2a1a';
  cx.fillRect(-9, 15 + bob + legF, 8, 4);
  cx.fillRect(1, 15 + bob - legF, 8, 4);
  cx.fillStyle = '#2266aa';
  cx.fillRect(-10, -3 + bob, 20, 14);
  cx.fillStyle = '#8a6a2a'; cx.fillRect(-10, 8 + bob, 20, 3);
  cx.fillStyle = '#ffd700'; cx.fillRect(-2, 8 + bob, 4, 3);
  cx.fillStyle = '#2266aa';
  cx.fillRect(-14, 0 + bob + armF, 5, 10);
  cx.fillRect(9, 0 + bob - armF, 5, 10);
  cx.fillStyle = '#e8c090';
  cx.fillRect(-14, 8 + bob + armF, 5, 4);
  cx.fillRect(9, 8 + bob - armF, 5, 4);
  cx.fillStyle = '#e8c090';
  cx.beginPath(); cx.arc(0, -9 + bob, 10, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#4a3520';
  cx.beginPath(); cx.arc(0, -13 + bob, 10, Math.PI, Math.PI * 2); cx.fill();
  cx.fillRect(-10, -13 + bob, 2, 6); cx.fillRect(8, -13 + bob, 2, 6);
  var eyeX = player.dir === 'left' ? -2 : player.dir === 'right' ? 2 : 0;
  var eyeYd = player.dir === 'up' ? -1 : player.dir === 'down' ? 1 : 0;
  cx.fillStyle = '#222';
  cx.fillRect(-5 + eyeX, -10 + bob + eyeYd, 3, 3);
  cx.fillRect(2 + eyeX, -10 + bob + eyeYd, 3, 3);
  cx.fillStyle = '#ccc'; cx.fillRect(12, -16 + bob, 2, 18);
  cx.fillStyle = '#8b6914'; cx.fillRect(10, -1 + bob, 6, 3);
  cx.restore();
  if (gameState === 'playing' && !answered) {
    var arrowAlpha = 0.4 + Math.sin(Date.now() * 0.004) * 0.3;
    cx.globalAlpha = arrowAlpha;
    cx.fillStyle = '#ffd700';
    cx.font = 'bold 16px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('▲', ppx, ppy - 52);
    cx.fillText('▲', ppx, ppy - 36);
    cx.globalAlpha = 1;
  }
  if (gameState === 'victory' || gameState === 'dialog') {
    var arrowAlpha2 = 0.4 + Math.sin(Date.now() * 0.004) * 0.3;
    cx.globalAlpha = arrowAlpha2;
    cx.fillStyle = '#ffd700';
    cx.font = 'bold 16px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('▲', ppx, ppy - 52);
    cx.fillText('▲', ppx, ppy - 36);
    cx.globalAlpha = 1;
    // 館を描画
    var bx = 10 * TILE + TILE / 2 - camOX;
    var by = (villageWorldY - 7) * TILE - camOY;
    // 石の基礎
    cx.fillStyle = '#8a7a60'; cx.fillRect(bx - 55, by + 20, 110, 80);
    cx.fillStyle = '#9a8a70'; cx.fillRect(bx - 52, by + 23, 104, 74);
    // 塔（左右）
    cx.fillStyle = '#7a6a50'; cx.fillRect(bx - 64, by, 22, 100);
    cx.fillStyle = '#7a6a50'; cx.fillRect(bx + 42, by, 22, 100);
    // 塔の屋根（三角）
    cx.fillStyle = '#5a3a1a';
    cx.beginPath(); cx.moveTo(bx - 64, by); cx.lineTo(bx - 53, by - 22); cx.lineTo(bx - 42, by); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(bx + 42, by); cx.lineTo(bx + 53, by - 22); cx.lineTo(bx + 64, by); cx.closePath(); cx.fill();
    // 本体屋根
    cx.fillStyle = '#4a2e10';
    cx.beginPath(); cx.moveTo(bx - 58, by + 20); cx.lineTo(bx, by - 8); cx.lineTo(bx + 58, by + 20); cx.closePath(); cx.fill();
    // 窓（左右）
    cx.fillStyle = '#ffd070'; cx.fillRect(bx - 42, by + 34, 16, 18);
    cx.fillStyle = '#ffd070'; cx.fillRect(bx + 26, by + 34, 16, 18);
    // 窓枠
    cx.strokeStyle = '#5a4020'; cx.lineWidth = 2;
    cx.strokeRect(bx - 42, by + 34, 16, 18);
    cx.strokeRect(bx + 26, by + 34, 16, 18);
    // ドア
    cx.fillStyle = '#3a2010'; cx.fillRect(bx - 10, by + 56, 20, 44);
    cx.fillStyle = '#5a3820'; cx.fillRect(bx - 8, by + 58, 16, 40);
    cx.fillStyle = '#c4a030'; cx.beginPath(); cx.arc(bx + 4, by + 78, 2.5, 0, Math.PI * 2); cx.fill();
    // 看板
    cx.fillStyle = '#6a4a1a'; cx.fillRect(bx - 30, by + 4, 60, 16);
    cx.strokeStyle = '#c4a030'; cx.lineWidth = 1.5; cx.strokeRect(bx - 30, by + 4, 60, 16);
    cx.fillStyle = '#ffd700'; cx.font = 'bold 10px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('🏰 英語の館', bx, by + 12);
    // 村人を描画
    var npx = bx;
    var npy = (villageWorldY) * TILE + TILE / 2 - camOY;
    cx.save(); cx.translate(npx, npy);
    // 影
    cx.fillStyle = 'rgba(0,0,0,0.15)';
    cx.beginPath(); cx.ellipse(0, 20, 12, 5, 0, 0, Math.PI * 2); cx.fill();
    // ローブ
    cx.fillStyle = '#8a5a2a';
    cx.beginPath(); cx.moveTo(-8, 0); cx.lineTo(8, 0); cx.lineTo(10, 18); cx.lineTo(-10, 18); cx.closePath(); cx.fill();
    // 足
    cx.fillStyle = '#6a4a1a'; cx.fillRect(-6, 14, 5, 8); cx.fillRect(1, 14, 5, 8);
    // 杖
    cx.fillStyle = '#7a5a2a'; cx.fillRect(12, -14, 3, 30);
    cx.fillStyle = '#c4a030'; cx.beginPath(); cx.arc(13, -15, 4, 0, Math.PI * 2); cx.fill();
    // 体
    cx.fillStyle = '#a07840'; cx.fillRect(-7, -2, 14, 12);
    // 頭
    cx.fillStyle = '#e8c090'; cx.beginPath(); cx.arc(0, -9, 9, 0, Math.PI * 2); cx.fill();
    // 帽子
    cx.fillStyle = '#4a2a80';
    cx.fillRect(-9, -18, 18, 6);
    cx.beginPath(); cx.moveTo(-5, -18); cx.lineTo(0, -30); cx.lineTo(5, -18); cx.closePath(); cx.fill();
    // 目
    cx.fillStyle = '#222'; cx.fillRect(-4, -11, 2.5, 2.5); cx.fillRect(1.5, -11, 2.5, 2.5);
    // ひげ
    cx.fillStyle = '#888'; cx.fillRect(-4, -5, 8, 1.5);
    cx.restore();
    // 会話アイコン（点滅）
    if (gameState === 'victory') {
      var talkAlpha = 0.5 + Math.sin(Date.now() * 0.006) * 0.5;
      cx.globalAlpha = talkAlpha;
      cx.font = '18px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText('💬', npx, npy - 44);
      cx.globalAlpha = 1;
    }
  }
  for (var pi = 0; pi < particles.length; pi++) {
    var pp = particles[pi];
    cx.globalAlpha = pp.life / 30; cx.fillStyle = pp.col;
    cx.beginPath(); cx.arc(pp.wx - camOX, pp.wy - camOY, pp.sz, 0, Math.PI * 2); cx.fill();
  }
  cx.globalAlpha = 1;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
